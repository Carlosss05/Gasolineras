# Compila el APK de Android firmado y lo publica en GitHub Releases.
# Se lanza al subir una etiqueta de versión (git tag v1.0.0 && git push --tags)
# o a mano desde la pestaña Actions.
name: Publicar Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secrets ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=gasolineras
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Compilar APK
        run: |
          # Cada compilación tiene un número de versión mayor que la anterior,
          # así Android acepta instalarla como actualización.
          flutter build apk --release --build-number=${{ github.run_number }}
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mv build/app/outputs/flutter-apk/app-release.apk "Gasolineras-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build{1}', env.VERSION, github.run_number) }}
          name: Gasolineras ${{ env.VERSION }} (build ${{ github.run_number }})
          files: Gasolineras-*.apk
          make_latest: true
          body: |
            Descarga el archivo **Gasolineras-${{ env.VERSION }}.apk** desde el móvil Android y ábrelo para instalarlo.
            Si Android lo pide, permite instalar apps de fuentes desconocidas para tu navegador.
