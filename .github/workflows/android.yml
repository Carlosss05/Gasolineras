# Compila el APK de Android firmado y lo publica en GitHub Releases.
# Se lanza al subir una etiqueta de versión (git tag v1.0.0 && git push --tags)
# o a mano desde la pestaña Actions.
name: Publicar Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secrets ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=gasolineras
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Compilar APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          OUT=build/app/outputs/flutter-apk

          # APK principal: solo arm64-v8a (casi todos los móviles), ~1/3 del tamaño.
          # Flutter le asigna el código de versión 2000 + número de build.
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-number=${{ github.run_number }}
          mv "$OUT/app-arm64-v8a-release.apk" "Gasolineras-$VERSION.apk"

          # APK universal para móviles antiguos, con el mismo código de versión
          # para que se pueda pasar de uno a otro y ambos se actualicen encima.
          flutter build apk --release --build-number=$((2000 + ${{ github.run_number }}))
          mv "$OUT/app-release.apk" "Gasolineras-$VERSION-universal.apk"
          ls -lh Gasolineras-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build{1}', env.VERSION, github.run_number) }}
          name: Gasolineras ${{ env.VERSION }} (build ${{ github.run_number }})
          files: Gasolineras-*.apk
          make_latest: true
          body: |
            Descarga **Gasolineras-${{ env.VERSION }}.apk** desde el móvil Android y ábrelo para instalarlo.
            Si Android lo pide, permite instalar apps de fuentes desconocidas para tu navegador.

            ¿No se instala? Tu móvil es muy antiguo: usa **Gasolineras-${{ env.VERSION }}-universal.apk** (más pesado, funciona en todos).
