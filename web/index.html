<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Encuentra las gasolineras más baratas y cercanas con precios oficiales.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Política de seguridad: el navegador solo permite cargar código y
       conectarse a los servidores que usa la app. Si alguien consiguiera
       inyectar contenido, no podría ejecutar scripts ni enviar datos a otro
       sitio. Al añadir un servicio nuevo hay que incluirlo aquí. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com
      https://sedeaplicaciones.minetur.gob.es https://nominatim.openstreetmap.org https://tile.openstreetmap.org;
    img-src 'self' data: blob: https://tile.openstreetmap.org;
    font-src 'self' data: https://fonts.gstatic.com;
    worker-src 'self' blob:;
    manifest-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0B8F5A">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gasolineras">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gasolineras baratas</title>
  <link rel="manifest" href="manifest.json">

  <!-- Arranque más rápido: el código de la app se descarga en paralelo con el
       resto y las conexiones a los servidores que se usan nada más abrir
       (motor de Flutter y precios) se preparan desde el principio. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://sedeaplicaciones.minetur.gob.es" crossorigin>
  <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org">
  <link rel="dns-prefetch" href="https://tile.openstreetmap.org">
  <style>
    /* Pantalla de carga mientras arranca Flutter (la tapa la propia app). */
    html, body { margin: 0; height: 100%; background: #0B8F5A; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(135deg, #10AA6C, #0F766E);
      color: #fff; font: 600 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #F5A524; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #splash { z-index: 2; }

    /* Contenedor de la app: por debajo de la barra de estado y del "notch"
       del iPhone; esa franja queda del verde de la marca. */
    #app {
      position: fixed; left: 0; right: 0; bottom: 0;
      top: env(safe-area-inset-top, 0px);
    }

    /* Aviso para instalar la app en iPhone (Safari no lo sugiere solo). */
    #install {
      position: fixed; left: 12px; right: 12px; z-index: 3;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      display: none; align-items: center; gap: 12px; padding: 12px 12px 12px 14px;
      background: #13221C; color: #fff; border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,.3);
      font: 500 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      animation: rise .35s ease-out;
    }
    #install.show { display: flex; }
    #install img { width: 44px; height: 44px; border-radius: 12px; flex: none; }
    #install b { color: #F5A524; }
    #install svg { width: 16px; height: 16px; vertical-align: -3px; fill: none; stroke: #F5A524; stroke-width: 2; }
    #install button {
      flex: none; width: 32px; height: 32px; border: 0; border-radius: 16px; cursor: pointer;
      background: rgba(255,255,255,.12); color: #fff; font-size: 18px; line-height: 32px;
    }
    @keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Cargando">
    <img src="icons/Icon-192.png" alt="">
    <div>Buscando los mejores precios…</div>
    <div class="bar"></div>
  </div>
  <div id="app"></div>
  <div id="install" role="dialog" aria-label="Instalar la app">
    <img src="icons/Icon-192.png" alt="">
    <div>
      <b>Instala Gasolineras</b><br>
      Pulsa <svg viewBox="0 0 24 24" aria-label="Compartir"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8"/></svg>
      y luego «Añadir a pantalla de inicio».
    </div>
    <button type="button" aria-label="Cerrar">×</button>
  </div>
  <script src="install.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
